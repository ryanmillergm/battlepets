name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'staging' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: target
        run: echo "environment=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/battlepets-server:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ needs.image.outputs.environment }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    if: needs.image.result == 'success'
    steps:
      - name: Require configured deployment secrets
        run: test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/battlepets
          chmod 600 ~/.ssh/battlepets
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable image
        run: >-
          ssh -i ~/.ssh/battlepets "$DEPLOY_USER@$DEPLOY_HOST"
          sudo /usr/local/sbin/deploy-battlepets
          "${{ needs.image.outputs.environment }}"
          "ghcr.io/${{ github.repository_owner }}/battlepets-server:${{ needs.image.outputs.sha }}"
