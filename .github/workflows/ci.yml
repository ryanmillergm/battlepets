name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  server:
    name: server-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: battlepets_test
          POSTGRES_USER: battlepets
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U battlepets -d battlepets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://battlepets:test-password@127.0.0.1:5432/battlepets_test
      JWT_SECRET: github-actions-test-secret-at-least-32-characters
      RUN_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run build
      - run: npm test

  admin:
    name: admin-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  gamemaker:
    name: gamemaker-source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate-gamemaker.mjs

  promotion:
    name: staging-only-promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require staging as the production source
        run: test "${{ github.head_ref }}" = "staging"
